name: RLR safety boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Install pinned OPA
        run: |
          curl -fsSL --retry 3 -o /tmp/opa https://github.com/open-policy-agent/opa/releases/download/v1.21.1/opa_linux_amd64_static
          echo '668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031  /tmp/opa' | sha256sum -c -
          sudo install -m755 /tmp/opa /usr/local/bin/opa
      - name: Python tests
        working-directory: rlr
        run: python -m pytest -q
      - name: Rego tests
        run: |
          opa fmt --fail policy/rlr.rego policy/rlr_test.rego
          opa check --v1-compatible policy/rlr.rego policy/rlr_test.rego
          opa test policy
      - name: Systemd unit validation
        run: systemd-analyze verify ops/thermal-guard.service ops/rlr-inference.service

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 -t jetson-xavier-rlr-ci .
