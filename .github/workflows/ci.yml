name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,crypto,quant-bench]"
      - name: Byte-compile (syntax check)
        run: python -m compileall -q src bench tests benchmarks scripts deploy
      - name: Import package
        run: python -c "import reflective_loop_runtime as r; print(r.__version__)"
      - name: Run tests
        run: python -m pytest -q
      - name: Run offline demo tick
        run: python -m reflective_loop_runtime demo --ticks 4 --data-dir ./.ci_demo

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff lint
        run: ruff check src bench tests benchmarks scripts deploy/stage2_toon_bridge.py deploy/bridge_hook_patch.py deploy/toon_v2_main.py deploy/stage2_paper_runner.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t reflective-loop-runtime:ci .

  toon-shadow-gates:
    name: TOON v2.2 shadow and simulation certification (non-trading)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev,crypto,quant-bench]"
      - name: Stage2 + quantitative integration and regressions
        run: python -m pytest -q tests/quant --disable-warnings
      - name: Offline deterministic 30 paper lifecycles (zero broker orders)
        run: python scripts/certify_alpaca_paper_30.py --mode deterministic-exchange-sim
      - name: 100000-tick simulated stability and WAL exercise
        run: python scripts/run_jetson_soak.py --stage a --ticks 100000 --output /tmp/toon22_100k.json
