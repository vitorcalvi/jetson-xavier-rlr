name: TOON v2.2 one-shot repository lint remediation
on:
  push:
    branches: ["feature/toon-v2-production-wiring"]
permissions:
  contents: write
jobs:
  autoformat:
    if: contains(github.event.head_commit.message, 'TOON22_RUN_STRICT_AUTOFORMAT')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/toon-v2-production-wiring
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned formatter and test extras
        run: |
          python -m pip install "ruff==0.17.1" -e ".[dev,crypto,quant-bench]"
      - name: Correct legacy parser and lint violations without protected edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/reflective_loop_runtime/trading/adaptive_gate.py')
          s=p.read_text()
          opening='from __future__ import annotations\n\n"""Fail-closed paper-entry research gate.'
          if s.startswith(opening):
              head, remain=s.split('"""',1)
              doc,tail=remain.split('"""',1)
              s='"""'+doc+'"""\n\n'+head.strip()+'\n'+tail
              p.write_text(s)
          p=Path('benchmarks/bench_leakage_null_test.py')
          if p.exists():
              s=p.read_text().replace('            test = set(split.test)\n','')
              p.write_text(s)
          p=Path('benchmarks/bench_toon_compression.py')
          if p.exists():
              s=p.read_text().replace('for l in f if l.strip()', 'for line in f if line.strip()')
              s=s.replace('json.loads(l) for line', 'json.loads(line) for line')
              p.write_text(s)
          p=Path('tests/trading/test_adaptive_gate_security.py')
          s=p.read_text().replace('for i in range(n):\n            segment.append','for _ in range(n):\n            segment.append')
          p.write_text(s)
          p=Path('tests/trading/test_remediation_static_guards.py')
          s=p.read_text().replace('        assert False\n','        raise AssertionError("production Alpaca host must be rejected")\n')
          p.write_text(s)
          p=Path('deploy/stage2_paper_runner.py')
          s=p.read_text()
          s=s.replace('        last_entry = 0.0\n','').replace('                        last_entry = now\n','')
          p.write_text(s)
          for name in ('tests/quant/test_stage2_hook_contract.py','tests/quant/test_stage2_toon_bridge.py'):
              p=Path(name)
              s=p.read_text()
              if not s.startswith('# ruff: noqa: E402'):
                  p.write_text('# ruff: noqa: E402\n'+s)
          PY
      - name: Ruff bounded autofix and normalize
        shell: bash
        run: |
          EXCLUDE="src/reflective_loop_runtime/kernel,tests/kernel,src/reflective_loop_runtime/governor.py,src/reflective_loop_runtime/executor.py"
          ruff check --fix --exclude "$EXCLUDE" src bench tests benchmarks scripts deploy/stage2_toon_bridge.py deploy/bridge_hook_patch.py deploy/toon_v2_main.py deploy/stage2_paper_runner.py || true
          ruff check --select B905 --fix --unsafe-fixes src/reflective_loop_runtime/quant || true
          ruff format --exclude "$EXCLUDE" src bench tests benchmarks scripts deploy/stage2_toon_bridge.py deploy/bridge_hook_patch.py deploy/toon_v2_main.py deploy/stage2_paper_runner.py
          ruff check src bench tests benchmarks scripts deploy/stage2_toon_bridge.py deploy/bridge_hook_patch.py deploy/toon_v2_main.py deploy/stage2_paper_runner.py
      - name: Ensure protected kernel unchanged and all tests pass
        shell: bash
        run: |
          git diff --name-only > /tmp/toon22_changed_paths.txt
          if grep -E '^(src/reflective_loop_runtime/kernel/|tests/kernel/|src/reflective_loop_runtime/(governor|executor)\.py|policy/|sandbox/)' /tmp/toon22_changed_paths.txt; then
            echo "PROTECTED SAFETY FILE DIFF BLOCKED" >&2
            exit 1
          fi
          python -m pytest -q
      - name: Commit and push only formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src bench tests benchmarks scripts deploy/stage2_toon_bridge.py deploy/bridge_hook_patch.py deploy/toon_v2_main.py deploy/stage2_paper_runner.py
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          if git diff --cached --name-only | grep -E '^(src/reflective_loop_runtime/kernel/|tests/kernel/|src/reflective_loop_runtime/(governor|executor)\.py|policy/|sandbox/)'; then
            echo "PROTECTED STAGED CONTENT DENIED" >&2
            exit 1
          fi
          git commit -m "TOON v2.2: strict Ruff formatting, 0 violations, no kernel changes"
          git push origin HEAD:feature/toon-v2-production-wiring
